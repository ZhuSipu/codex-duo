name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test models
        run: ./Scripts/test.sh
      - name: Build and verify app
        run: |
          app_path=$(./Scripts/build_app.sh)
          codesign --verify --deep --strict "$app_path"
          test -x "$app_path/Contents/MacOS/CodexDuo"
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Test Windows models
        run: dotnet run --project Windows/CodexDuo.Windows.Tests/CodexDuo.Windows.Tests.csproj -c Release
      - name: Build Windows app
        run: dotnet publish Windows/CodexDuo.Windows/CodexDuo.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None
