name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Test models
        run: ./Scripts/test.sh
      - name: Build and verify app
        run: |
          app_path=$(./Scripts/build_app.sh)
          codesign --verify --deep --strict "$app_path"
          test -x "$app_path/Contents/MacOS/CodexDuo"
          test -x "$app_path/Contents/Helpers/codex-auth"
          test "$("$app_path/Contents/Helpers/codex-auth" --version)" = "codex-auth 0.3.0-alpha.10"
          test -f "$app_path/Contents/Resources/THIRD_PARTY_NOTICES.md"

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Restore
        run: dotnet restore Windows/CodexDuo.Windows.sln
      - name: Test
        run: dotnet test Windows/CodexDuo.Windows.sln -c Release --no-restore --nologo
      - name: Publish and verify app
        shell: pwsh
        run: |
          dotnet publish Windows/CodexDuo.Windows/CodexDuo.Windows.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:PublishReadyToRun=false -p:EnableCompressionInSingleFile=true -p:DebugType=None -o build/windows-ci-portable --nologo
          dotnet publish Windows/CodexDuo.Windows/CodexDuo.Windows.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=false -p:DebugType=None -o build/windows-ci-installer --nologo
          if (-not (Test-Path -LiteralPath build/windows-ci-portable/CodexDuo.exe)) { throw "Portable CodexDuo.exe was not produced." }
          if (-not (Test-Path -LiteralPath build/windows-ci-installer/CodexDuo.exe)) { throw "Installer CodexDuo.exe was not produced." }
