name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Verify version tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Test and package
        run: |
          ./Scripts/test.sh
          ./Scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify version tag
        shell: pwsh
        run: |
          $project = [xml](Get-Content Windows/CodexDuo.Windows/CodexDuo.Windows.csproj)
          $version = [string]$project.Project.PropertyGroup.Version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag does not match Windows version $version." }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Test and package
        shell: pwsh
        run: ./Scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*Windows*

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
