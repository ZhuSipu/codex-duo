name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Verify version tag
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME"
      - name: Test and package
        run: |
          ./Scripts/test.sh
          ./Scripts/package_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-release
          path: dist/*

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Verify version tag
        shell: pwsh
        run: |
          $project = [xml](Get-Content Windows/CodexDuo.Windows/CodexDuo.Windows.csproj)
          $version = [string]$project.Project.PropertyGroup.Version
          if ("v$version" -ne "$env:GITHUB_REF_NAME") { throw "Tag does not match Windows version $version." }
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Test and package
        shell: pwsh
        run: ./Scripts/package_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: dist/*Windows*

  publish:
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-release"
          path: dist
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          notes=$(printf '%s\n' \
            '## 下载说明 / Download guide' \
            '' \
            '只需下载与你的系统匹配的安装包；`SHA256SUMS-*.txt` 仅用于校验，不是安装包。' \
            '' \
            '### macOS Apple Silicon' \
            "- 推荐下载：\`Codex-Duo-${release_version}-macOS-arm64.dmg\`。打开后将 Codex Duo 拖入 Applications。" \
            '' \
            '### Windows x64' \
            "- 推荐下载：\`Codex-Duo-${release_version}-Windows-x64-Setup.exe\`，当前用户安装且无需管理员权限。" \
            "- 便携版：\`Codex-Duo-${release_version}-Windows-x64-portable.zip\`，无需安装，解压后直接运行。" \
            '' \
            '### English' \
            'Download only the installer matching your operating system. Checksum files are for verification only.' \
            "- macOS Apple Silicon: \`Codex-Duo-${release_version}-macOS-arm64.dmg\` is the standard installer." \
            "- Windows x64: \`Codex-Duo-${release_version}-Windows-x64-Setup.exe\` is recommended; the portable ZIP runs without installation.")

          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            while IFS= read -r asset; do
              if [[ -n "$asset" && ! -e "dist/$asset" ]]; then
                gh release delete-asset "$GITHUB_REF_NAME" "$asset" --repo "$GITHUB_REPOSITORY" --yes
              fi
            done < <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
            gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Codex Duo $GITHUB_REF_NAME" --notes "$notes" --latest
          else
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Codex Duo $GITHUB_REF_NAME" --notes "$notes" --latest
          fi
